name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test identity and application authorization
        run: pnpm test:authorization
      - name: Test Supabase authorization repository integration
        run: pnpm test:authorization:integration
      - name: Test PostgreSQL persistence
        run: pnpm test:persistence
      - name: Test Supabase tenant RLS
        run: pnpm test:rls
      - run: pnpm build
      - run: pnpm sdk:pack
