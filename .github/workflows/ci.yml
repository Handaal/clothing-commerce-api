name: CI

# NOTE (true per-run isolation task, 2026-11-08): the shared-CLI RLS/integration runners once drove the
# Supabase CLI against the repo config with no --workdir, resolving the shared project
# `clothing-commerce-api` and finishing with `stop --no-backup` (Phase 2M data-loss path). They were
# fail-closed and removed from CI. They are now RESTORED on the per-run-isolated boundary
# (scripts/isolated-supabase-suite.mjs → returns-test-resources.mjs): each mints a unique rt-<hex>
# Supabase in a disposable workdir, pins every CLI call to --workdir, and cleans up only its own
# labelled resources. Every step below either runs DB-free, spins its own disposable postgres container
# (test:*:persistence / test:*:concurrency), or mints an rt-<hex> Supabase. The restored RLS/integration
# suites run in the dedicated `restored-isolated-suites` job (kept separate so the fast feedback jobs are
# not slowed by ~18 cold Supabase starts). No step resolves the shared/default project; no bypass exists.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test identity and application authorization
        run: pnpm test:authorization
      - name: Test PostgreSQL persistence
        run: pnpm test:persistence
      - name: Test catalog PostgreSQL persistence
        run: pnpm test:catalog:persistence
      - name: Test inventory PostgreSQL persistence
        run: pnpm test:inventory:persistence
      - name: Test inventory operation PostgreSQL persistence
        run: pnpm test:inventory:operations:persistence
      - name: Test catalog category concurrency
        run: pnpm test:catalog:concurrency
      - name: Test inventory balance concurrency
        run: pnpm test:inventory:concurrency
      - name: Test inventory operation concurrency
        run: pnpm test:inventory:operations:concurrency
      - name: Test orders PostgreSQL persistence
        run: pnpm test:orders:persistence
      - name: Test orders concurrency
        run: pnpm test:orders:concurrency
      - name: Test fulfillment PostgreSQL persistence
        run: pnpm test:fulfillment:persistence
      - name: Test fulfillment concurrency
        run: pnpm test:fulfillment:concurrency
      - name: Test management persistence (catalog.read seed and list indexes)
        run: pnpm test:management:persistence
      - name: Test external API contracts
        run: pnpm test:api:contracts
      - name: Test OpenAPI document
        run: pnpm test:openapi
      - name: Test offline POS RLS (isolated rt-<hex> Supabase)
        run: pnpm test:pos:offline:rls
      - name: Test offline POS integration (isolated rt-<hex> Supabase)
        run: pnpm test:pos:offline:integration
      - name: Test suppliers and returns persistence, RLS, concurrency, and runtime (isolated)
        run: pnpm test:returns:safety && pnpm test:suppliers:persistence && pnpm test:suppliers:integration
      - name: Test staff management persistence and RLS (isolated)
        run: pnpm test:staff:persistence && pnpm test:staff:rls
      - name: Test SDK build, contracts, and self-contained packaging
        run: pnpm test:sdk
      - run: pnpm build
      - run: pnpm sdk:pack

  modern-domain-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test catalog management persistence
        run: pnpm test:catalog:management
      - name: Test online commerce persistence
        run: pnpm test:online:persistence
      - name: Test Promotion persistence and concurrency
        run: pnpm test:promotions:persistence && pnpm test:promotions:concurrency
      - name: Test Reporting persistence and exports
        run: pnpm test:reporting:persistence && pnpm test:reporting:export:persistence
      - name: Test operational Settings persistence and topology
        run: pnpm test:settings:persistence

  # Restored shared-CLI RLS/integration suites, now each isolated on its own disposable rt-<hex> Supabase
  # (scripts/isolated-supabase-suite.mjs). Kept in a dedicated job so the ~18 cold Supabase starts do not
  # slow the fast-feedback `verify` job. Generous timeout because every suite starts its own stack.
  restored-isolated-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tenant RLS (isolated rt-<hex>)
        run: pnpm test:rls
      - name: Catalog RLS (isolated rt-<hex>)
        run: pnpm test:catalog:rls
      - name: Inventory RLS (isolated rt-<hex>)
        run: pnpm test:inventory:rls
      - name: Inventory-operations RLS (isolated rt-<hex>)
        run: pnpm test:inventory:operations:rls
      - name: Orders RLS (isolated rt-<hex>)
        run: pnpm test:orders:rls
      - name: Fulfillment RLS (isolated rt-<hex>)
        run: pnpm test:fulfillment:rls
      - name: Online + shared RLS set (isolated rt-<hex>)
        run: pnpm test:online:rls
      - name: Authorization integration (isolated rt-<hex>)
        run: pnpm test:authorization:integration
      # test:dev:provisioning and test:dev:commerce-fixture remain DISABLED/fail-closed: they spawn dev
      # scripts hardcoded to the shared container (supabase_db_clothing-commerce-api) and cannot be
      # isolated without parameterizing those scripts (see scripts/test-dev-*.mjs headers).
      - name: Management API integration (isolated rt-<hex>)
        run: pnpm test:api:integration
      - name: Inventory-operations integration (isolated rt-<hex>)
        run: pnpm test:inventory:operations:integration
      - name: Inventory write-boundary integration (isolated rt-<hex>)
        run: pnpm test:inventory:write:integration
      - name: Orders integration (isolated rt-<hex>)
        run: pnpm test:orders:integration
      - name: Fulfillment integration (isolated rt-<hex>)
        run: pnpm test:fulfillment:integration
      - name: Catalog-management integration (isolated rt-<hex>)
        run: pnpm test:catalog:management:integration
      - name: Connected POS sale integration (isolated rt-<hex>)
        run: pnpm test:pos:sale:integration
      # test:online:integration (test-online-commerce.mjs) is restored to isolated execution (boots the
      # real Next server against an rt-<hex> stack) but is NOT gated here yet: its fixtures/expectations
      # were calibrated to the drifted shared dev project and currently fail on a canonical fresh-migration
      # DB. Reconcile the suite (see offline-first-roadmap §12) before adding its step.
