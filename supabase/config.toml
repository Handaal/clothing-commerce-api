# Repository-local Supabase CLI configuration for Phase 1C-B security testing.
# No remote project reference or cloud credential belongs in this file.
project_id = "clothing-commerce-api"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[api]
# The server-side inventory (Phase 2C) and orders (Phase 2D) application layers call sanctioned
# functions in their private schemas via PostgREST (service-role client). Exposing a schema does NOT
# grant access: USAGE is revoked from anon/authenticated and EXECUTE is granted only to service_role,
# so schema exposure is not the security boundary -- the function grants are. public remains the
# default client surface.
schemas = ["public", "inventory_private", "orders_private"]
extra_search_path = ["public", "extensions"]
