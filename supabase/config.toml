# Repository-local Supabase CLI configuration for Phase 1C-B security testing.
# No remote project reference or cloud credential belongs in this file.
project_id = "clothing-commerce-api"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[api]
# Server-side inventory, orders, fulfillment, and Connected POS application layers call sanctioned
# layers call sanctioned functions in their private schemas via PostgREST (service-role client).
# Exposing a schema does NOT grant access: USAGE is revoked from anon/authenticated and EXECUTE is
# granted only to service_role, so schema exposure is not the security boundary -- the function grants
# are. In particular fulfillments_private.record_fulfillment_issue lives in inventory_private and is
# granted to fulfillments_writer only, so exposing these schemas never lets service_role issue stock
# directly. public remains the default client surface.
# catalog_private holds the sanctioned catalog write functions (EXECUTE granted to service_role only);
# catalog_public holds the published-only Storefront read functions (EXECUTE granted to anon too).
schemas = ["public", "inventory_private", "orders_private", "fulfillments_private", "pos_sales_private", "offline_pos_private", "catalog_private", "catalog_public", "online_private", "returns_private"]
extra_search_path = ["public", "extensions"]
